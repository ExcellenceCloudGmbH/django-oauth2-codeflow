name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  schedule:
    - cron: '17 2 * * *'  # nightly: the Keycloak integration job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TEST_DEPS: pytest pytest-django pytest-cov pytest-html pytest-timeout freezegun

jobs:
  lint:
    name: flake8 and mypy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (locked)
        run: |
          pip install 'poetry==1.8.5'
          poetry install -n --with dev,typing --all-extras
      - run: poetry run flake8 oauth2_authcodeflow test
      - run: poetry run mypy oauth2_authcodeflow

  unit:
    name: unit (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        django: ['4.2', '5.2', '6.0']
        exclude:
          # Django 6.0 needs Python 3.12+; Django 4.2 does not support Python 3.13
          - {python: '3.10', django: '6.0'}
          - {python: '3.11', django: '6.0'}
          - {python: '3.13', django: '4.2'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e '.[drf,channels]' "Django~=${{ matrix.django }}.0" $TEST_DEPS
      - name: Unit tests (SQLite)
        run: pytest test

  postgres:
    name: concurrency (Postgres 16)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      OIDC_PG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[drf,channels]' 'Django~=5.2.0' psycopg2-binary $TEST_DEPS
      - name: Concurrency tests
        run: pytest test/pg -m postgres --ds=test.pg.settings_pg

  keycloak:
    name: integration (Keycloak 26)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OIDC_KC_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull Keycloak
        run: docker pull quay.io/keycloak/keycloak:26.7.5
      - name: Install
        run: pip install -e '.[drf,channels]' 'Django~=5.2.0' $TEST_DEPS
      - name: Integration tests (the suite starts and removes the container)
        run: pytest test/keycloak -m keycloak --ds=test.keycloak.settings_kc

  build:
    name: build
    if: github.event_name != 'schedule'
    needs: [lint, unit, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
