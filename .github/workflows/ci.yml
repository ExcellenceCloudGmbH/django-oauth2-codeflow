name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mypy also checks test/, so it needs the dev group test dependencies (pytest, pytest-django, freezegun)
      - run: pip install flake8 flake8-pyproject isort mypy django-types types-requests "django>=5.2" "pyjwt[crypto]>=2.15" "requests>=2.28" freezegun pytest pytest-django
      - run: flake8 oauth2_authcodeflow test
      - run: mypy .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        django: ["4.2", "5.2", "6.0"]
        exclude:
          # Django 6.0 requires Python >= 3.12
          - { python: "3.10", django: "6.0" }
          - { python: "3.11", django: "6.0" }
          # Django 4.2 does not support Python 3.13
          - { python: "3.13", django: "4.2" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "django~=${{ matrix.django }}.0" "pyjwt[crypto]>=2.15" "requests>=2.28" freezegun pytest pytest-cov pytest-django pytest-html
      - run: pytest
